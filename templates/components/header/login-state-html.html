{% with user=request.user %}
  {% if user.is_authenticated %}
    <a class="at-btn d-none d-md-block btn-accent green rounded-pill"
       role="button"
       href="{{ user.get_dashboard_url }}">
      <span>
        <span class="text-1 text-capitalize">Access Dashboard</span>
        <span class="text-2 text-capitalize">Access Dashboard</span>
      </span>
    </a>
  {% else %}
    <a class="at-btn d-none d-md-block btn-accent green rounded-pill"
       role="button"
       href="{% url 'account_login' %}">
      <span>
        <span class="text-1 text-capitalize">Get Started</span>
        <span class="text-2 text-capitalize">Get Started</span>
      </span>
    </a>
  {% endif %}
{% endwith %}
