<div class="card border-0 mb-2 empty-state-card search-retrieval-empty">
  <div class="card-body p-3">
    <div class="d-flex align-items-center justify-content-center flex-column py-5">
      <!-- Empty icon -->
      <div class="d-flex align-items-center justify-content-center mb-3 h-64 w-64 icon-container">
        <i class="bi bi-folder2-open"
           style="font-size: 1.75rem;
                  color: rgba(113, 255, 174, 0.5)"></i>
      </div>
      <!-- Title -->
      <h6 class="fw-semibold text-center mb-1 empty-heading">No files found</h6>
      <!-- Description -->
      <p class="text-center mb-3 px-3 empty-description">
        You haven't uploaded any files yet. Get started by uploading your first document.
      </p>
      <!-- Upload button -->
      <button type="button"
              class="btn btn-sm d-inline-flex align-items-center gap-2 btn-empty-session">
        <i class="bi bi-cloud-upload" style="font-size: 0.875rem;"></i>
        Upload Now
      </button>
    </div>
  </div>
</div>
