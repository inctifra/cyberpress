<div class="container-fluid">
  <div class="row g-4">
    <!-- LEFT: Cybercafes list -->
    <div class="col-lg-4 border-end border-secondary">
      <h6 class="mb-3">Nearby Cybercafes</h6>

      <div class="d-flex flex-column gap-3">
        <!-- single cafe -->
        <div class="p-3 rounded-3 bg-secondary bg-opacity-25">
          <div class="d-flex justify-content-between">
            <strong>Ruiru Print Hub</strong>
            <span class="small">0.8 km</span>
          </div>
          <small class="text-light opacity-75">KES 5/page (B/W)</small>
        </div>

        <div class="p-3 rounded-3 bg-secondary bg-opacity-25">
          <div class="d-flex justify-content-between">
            <strong>QuickPrint Cyber</strong>
            <span class="small">1.4 km</span>
          </div>
          <small class="text-light opacity-75">KES 20/page (Color)</small>
        </div>
      </div>
    </div>

    <!-- MIDDLE: Pricing + Services -->
    <div class="col-lg-4 border-end border-secondary">
      <h6 class="mb-3">Services & Pricing</h6>

      <div class="p-3 rounded-3 bg-secondary bg-opacity-25 mb-3">
        <div class="d-flex justify-content-between">
          <span>B/W Print</span>
          <span>KES 5</span>
        </div>
        <div class="d-flex justify-content-between">
          <span>Color Print</span>
          <span>KES 20</span>
        </div>
      </div>

      <h6 class="mt-3">Services</h6>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">Printing</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">Scanning</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" />
        <label class="form-check-label">Binding</label>
      </div>
    </div>

    <!-- RIGHT: Instructions -->
    <div class="col-lg-4">
      <h6 class="mb-3">Instructions</h6>

      <textarea class="form-control bg-dark text-light border-secondary" rows="6" placeholder="Describe how you want your document printed..."></textarea>

      <!-- Voice -->
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-outline-light"><i class="bi bi-mic"></i> Record</button>

        <button class="btn btn-success"><i class="bi bi-upload"></i> Upload Voice</button>
      </div>

      <!-- Submit -->
      <button class="btn btn-success w-100 mt-4 py-3">Send Request</button>
    </div>
  </div>
</div>
